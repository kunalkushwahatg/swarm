[package]
name = "swarm-tunnel"
version = "0.1.0"
edition = "2021"
description = "QUIC tunnel for Swarm GGML RPC traffic (LAN, internet, relay)"
license = "MIT"

[[bin]]
name = "swarm-tunnel"
path = "src/main.rs"

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
anyhow = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-android]
inherits = "release"
panic = "unwind"
